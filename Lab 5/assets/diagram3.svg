<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="弧端、凸唇与中心槽 / Curved end, lip and central slot"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8,0 0,4 8,8" fill="none" stroke="#607387" stroke-width="1"/></marker></defs><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#223b50;font-size:14px}.geometry{fill:#dceafe;fill-opacity:.65;stroke:#2468d9;stroke-width:2.6}.new{fill:none;stroke:#2468d9;stroke-width:2.8}.ghost{fill:none;stroke:#d88a69;stroke-width:1.5;stroke-dasharray:7 5}.center{fill:none;stroke:#97a9b7;stroke-width:1;stroke-dasharray:9 3 2 3}.dim{fill:none;stroke:#607387;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{fill:none;stroke:#98aaba;stroke-width:1}.leader{fill:none;stroke:#607387;stroke-width:1;marker-end:url(#arrow)}.small{font-size:12px}.muted{fill:#627a8e}.title{font-size:17px;font-weight:bold}</style><rect width="900" height="600" rx="12" fill="#f5f9fc"/><text x="24" y="28" class="title">弧端、凸唇与中心槽 / Curved end, lip and central slot</text><text x="24" y="49" class="muted small">尺寸与几何关系示意 / Dimension and relation guide · mm</text><text x="40" y="89" class="" font-weight="bold">A：沿斜板法向看 / Normal to ramp</text><path class="geometry" d="M52,150 L284.521,150 A208.0,208.0 0 0 1 284.521,342 L52,342 Z"/><line class="ghost" x1="308.000" y1="150.000" x2="308.000" y2="342.000"/><line class="new" x1="205.600" y1="150.000" x2="205.600" y2="342.000"/><line class="center" x1="42.000" y1="246.000" x2="333.000" y2="246.000"/><line class="center" x1="100.000" y1="150.000" x2="100.000" y2="342.000"/><line class="dim" x1="100.000" y1="246.000" x2="308.000" y2="246.000"/><text x="185" y="232" class="" >R65</text><circle cx="100.0" cy="246" r="3" fill="#2468d9"/><text x="63" y="280" class="small" >圆心 / Arc centre</text><line class="ext" x1="205.600" y1="145.000" x2="205.600" y2="110.000"/><line class="ext" x1="308.000" y1="145.000" x2="308.000" y2="110.000"/><line class="dim" x1="205.600" y1="118.000" x2="308.000" y2="118.000"/><text x="256.8" y="106" class="" text-anchor="middle">32</text><line class="dim" x1="37.000" y1="150.000" x2="37.000" y2="342.000"/><text x="24" y="246" class="" transform="rotate(-90 24 246)" text-anchor="middle">60</text><line class="center" x1="205.600" y1="206.000" x2="304.118" y2="206.000"/><line class="center" x1="205.600" y1="286.000" x2="304.118" y2="286.000"/><text x="40" y="383" class="small" >橙色虚线：切弧前的平端</text><text x="40" y="402" class="small" >Orange dashed: previous straight end</text><text x="40" y="429" class="small" >R65 位于斜板面内；弧线向外凸。</text><text x="40" y="448" class="small" >R65 lies in the ramp plane and bulges outward.</text><text x="40" y="475" class="small" >最远端沿坡长度仍为 80。</text><text x="40" y="494" class="small" >The farthest tip remains 80 along the ramp.</text><text x="40" y="526" class="small" >中心槽位于凸唇下方；投影用虚线表示。</text><text x="40" y="545" class="small" >The slot lies under the lip roof; its edges are hidden.</text><text x="450" y="89" class="" font-weight="bold">B：局部展开侧剖 / Aligned local section</text><text x="450" y="110" class="small" >图形已转正，厚度均沿斜板法向 / Thicknesses normal to ramp</text><path class="geometry" d="M460,240 H634.4 V290.4 H460 Z"/><rect class="geometry" x="500" y="177" width="134.39999999999998" height="37.80000000000001"/><line class="ext" x1="500.000" y1="172.000" x2="500.000" y2="142.000"/><line class="ext" x1="634.400" y1="172.000" x2="634.400" y2="142.000"/><line class="dim" x1="500.000" y1="150.000" x2="634.400" y2="150.000"/><text x="567.2" y="139" class="" text-anchor="middle">32</text><line class="ext" x1="640.400" y1="177.000" x2="720.000" y2="177.000"/><line class="ext" x1="640.400" y1="290.400" x2="720.000" y2="290.400"/><line class="dim" x1="709.000" y1="177.000" x2="709.000" y2="290.400"/><text x="725" y="239" class="" >27 总厚 / Overall</text><line class="ext" x1="640.400" y1="214.800" x2="665.000" y2="214.800"/><line class="ext" x1="640.400" y1="240.000" x2="665.000" y2="240.000"/><line class="dim" x1="655.000" y1="214.800" x2="655.000" y2="240.000"/><text x="671" y="232" class="" >6</text><text x="555" y="273" class="" text-anchor="middle">12</text><text x="555" y="202" class="" text-anchor="middle">9*</text><text x="462" y="323" class="small" >27 = 12 + 6 + 9*；*9 为推导值 / *9 is derived</text><text x="462" y="345" class="small" >中央剖面开槽；两侧实体仍连接 / Side walls retain the connection</text><text x="450" y="382" class="" font-weight="bold">C：槽宽与对称 / Slot width and symmetry</text><rect class="geometry" x="465" y="409" width="252.0" height="113.4"/><rect x="538.5" y="446.8" width="105.0" height="25.200000000000003" fill="#f5f9fc" stroke="#2468d9" stroke-width="2.4"/><line class="center" x1="591.000" y1="399.000" x2="591.000" y2="536.400"/><line class="ext" x1="538.500" y1="433.800" x2="538.500" y2="442.800"/><line class="ext" x1="643.500" y1="433.800" x2="643.500" y2="442.800"/><line class="dim" x1="538.500" y1="436.800" x2="643.500" y2="436.800"/><text x="591.0" y="427.8" class="small" text-anchor="middle">25 中面 / Mid Plane</text><line class="ext" x1="465.000" y1="528.400" x2="465.000" y2="550.400"/><line class="ext" x1="717.000" y1="528.400" x2="717.000" y2="550.400"/><line class="dim" x1="465.000" y1="544.400" x2="717.000" y2="544.400"/><text x="591.0" y="562.4" class="small" text-anchor="middle">60 总宽 / Total width</text><text x="748" y="452" class="small" >前视基准面</text><text x="748" y="470" class="small" >Front Plane</text><path class="leader" d="M746,480 L594.0,500"/><text x="748" y="505" class="small" >槽各伸 12.5</text><text x="748" y="523" class="small" >Slot: 12.5 per side</text><text x="24" y="580" class="small" >教学示意，非软件截图 / Teaching diagram, not a SOLIDWORKS screenshot</text></svg>