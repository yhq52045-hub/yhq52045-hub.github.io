          els.hits.textContent = `${lock}% LOCK`;

      }

      function updateStability() {
        if (!state.pointer.inside) return;
        const radius = configs.stability.size / 2;
        const d = Math.hypot(state.pointer.x - state.target.x, state.pointer.y - state.target.y);
        state.stabilitySamples++;
        state.stabilityDistances.push(d);
        if (d <= radius) state.stabilityInside++;
        const hold = Math.round(state.stabilityInside / state.stabilitySamples * 100);
        els.hits.textContent = `${hold}% HOLD`;
      }

      function updateSteeringPointer() {
        const point = state.steeringPoints[state.steeringIndex];
        if (!point) return;
        const d = Math.hypot(state.pointer.x - point.x, state.pointer.y - point.y);
        state.steeringSamples++;
        state.steeringErrors.push(d);
        if (d <= configs.steering.size * .72) state.steeringInside++;
        if (d > configs.steering.size / 2 + 3) return;
        const now = performance.now();
        if (now - state.lastHitAt < 45) return;
        state.lastHitAt = now;
        state.hitCount++;
        state.steeringIndex++;
        flashAt(point.x, point.y);
        els.hits.textContent = `${Math.round(state.hitCount / configs.steering.goal * 100)}% PATH`;
        els.guideProgress.setAttribute('d', pathData(state.steeringPoints, Math.min(state.steeringIndex, state.steeringPoints.length - 1)));
        if (state.hitCount >= configs.steering.goal) finishTest();
        else {
          const next = state.steeringPoints[state.steeringIndex];
          placeTarget(next.x, next.y);
        }
      }

      function pointerMove(e) {
        const rect = arenaBounds();
        const previous = state.pointer.inside ? { x: state.pointer.x, y: state.pointer.y } : null;
        state.pointer.x = clamp(e.clientX - rect.left, 0, rect.width);
        state.pointer.y = clamp(e.clientY - rect.top, 0, rect.height);
        state.pointer.inside = true;
        els.crosshair.style.left = `${state.pointer.x}px`;
        els.crosshair.style.top = `${state.pointer.y}px`;
        els.crosshair.classList.add('show');
        if (state.phase !== 'running' || state.activeTest === 'tracking') return;
        if (state.activeTest === 'stability') {
          const now = performance.now();
          if (previous && state.lastStabilityPoint) {
            const dt = Math.max(1, now - state.lastStabilityPoint.time);
            state.stabilitySpeeds.push(Math.hypot(state.pointer.x - previous.x, state.pointer.y - previous.y) / dt * 1000);
          }
          state.lastStabilityPoint = { x: state.pointer.x, y: state.pointer.y, time: now };
          return;
        }
        if (state.activeTest === 'steering') {
          updateSteeringPointer();
          return;
        }
        if (state.lastPointer) state.pathSinceSpawn += Math.hypot(state.pointer.x - state.lastPointer.x, state.pointer.y - state.lastPointer.y);
        state.lastPointer = { x: state.pointer.x, y: state.pointer.y };
        const radius = configs[state.activeTest].size / 2;
        if (Math.hypot(state.pointer.x - state.target.x, state.pointer.y - state.target.y) <= radius) registerHit();
      }

      function registerHit() {
        const now = performance.now(), c = configs[state.activeTest];
        if (now - state.lastHitAt < 90) return;
        state.lastHitAt = now;
        state.hitCount++;
        state.acquisitions.push(now - state.spawnedAt);
        const eff = state.pathSinceSpawn > 4 && state.directSinceSpawn > 0 ? clamp(state.directSinceSpawn / state.pathSinceSpawn, 0, 1) : .72;
        state.efficiencies.push(eff);
        els.hits.textContent = `${state.hitCount} / ${c.goal}`;
        flashAt(state.target.x, state.target.y);
        if (state.hitCount >= c.goal) finishTest(); else spawnStatic();
      }

      function flashAt(x, y) {
        const ring = document.createElement('i');
        ring.className = 'hit-flash'; ring.style.left = `${x}px`; ring.style.top = `${y}px`;
        els.arena.appendChild(ring); setTimeout(() => ring.remove(), 350);
      }

      function scoreRun(type) {
        const c = configs[type];
        if (type === 'tracking') {
          if (!state.trackingSamples) return { score: 0, lock: 0, avgDistance: 0, hits: '0%', avg: '—', efficiency: '0%' };
          const lock = state.trackingSamples ? state.trackingInside / state.trackingSamples : 0;
          const avgDist = mean(state.trackingDistance);
          const control = clamp(100 - Math.max(0, avgDist - 10) * 1.45, 0, 100);
          return { score: Math.round(clamp(lock * 82 + control * .18, 0, 100)), lock: lock * 100, avgDistance: avgDist, hits: `${Math.round(lock * 100)}%`, avg: `${avgDist.toFixed(1)} px`, efficiency: `${Math.round(control)}%` };
        }
        if (type === 'steering') {
          if (!state.steeringSamples) return { score: 0, completed: 0, corridor: 0, avgDistance: 0, hits: '0%', avg: '—', efficiency: '0%' };
          const completed = clamp(state.hitCount / c.goal, 0, 1);
          const corridor = state.steeringSamples ? state.steeringInside / state.steeringSamples : 0;
          const avgError = mean(state.steeringErrors);
          const control = clamp(100 - Math.max(0, avgError - 8) * 2.2, 0, 100);
          const score = Math.round(clamp(completed * 50 + corridor * 30 + control * .20, 0, 100));
          return { score, completed: completed * 100, corridor: corridor * 100, avgDistance: avgError, hits: `${Math.round(completed * 100)}%`, avg: `${avgError.toFixed(1)} px`, efficiency: `${Math.round(corridor * 100)}%` };
        }
        if (type === 'stability') {
          if (!state.stabilitySamples) return { score: 0, hold: 0, avgDistance: 0, medianSpeed: 0, hits: '0%', avg: '—', efficiency: '0%' };
          const hold = state.stabilitySamples ? state.stabilityInside / state.stabilitySamples : 0;
          const avgDist = mean(state.stabilityDistances);
          const medianSpeed = median(state.stabilitySpeeds);
          const centerControl = clamp(100 - Math.max(0, avgDist - 2) * 4.2, 0, 100);
          const tremorControl = clamp(100 - medianSpeed * .42, 0, 100);
          const score = Math.round(clamp(hold * 62 + centerControl * .23 + tremorControl * .15, 0, 100));
          return { score, hold: hold * 100, avgDistance: avgDist, medianSpeed, hits: `${Math.round(hold * 100)}%`, avg: `${avgDist.toFixed(1)} px`, efficiency: `${Math.round(tremorControl)}%` };
        }
        const completed = state.hitCount / c.goal;
        const med = median(state.acquisitions) || c.duration * 1000;
        const eff = mean(state.efficiencies) || 0;
        const speedRange = type === 'flick' ? [350, 1200] : type === 'switching' ? [480, 1450] : [520, 1600];
        const speed = clamp(100 - (med - speedRange[0]) / (speedRange[1] - speedRange[0]) * 100, 0, 100);
        const score = Math.round(clamp(completed * 45 + eff * 35 + speed * .20, 0, 100));
        return { score, completed: completed * 100, median: med, pathEfficiency: eff * 100, hits: `${state.hitCount}/${c.goal}`, avg: `${Math.round(med)} ms`, efficiency: `${Math.round(eff * 100)}%` };
      }

      function finishTest() {
        if (state.phase !== 'running') return;
        cancelAnimationFrame(state.raf);
        state.phase = 'finished';
        els.target.classList.remove('visible');
        els.guide.classList.remove('show');
        els.time.textContent = '0.0';
        const type = state.activeTest, r = scoreRun(type);
        state.results[type] = r;
        save(); updateTestChecks();
        els.finishScore.textContent = r.score;
        els.finishTitle.textContent = r.score >= 80 ? '校准完成 · 状态出色' : r.score >= 60 ? '校准完成 · 数据有效' : '校准完成 · 建议重测';
        els.finishCopy.textContent = r.score < 45 ? '本轮有效数据偏少，可以重测一次获得更稳的推荐。' : '表现已写入你的本地档案，可继续下一项。';
        els.finishHit.textContent = r.hits; els.finishTime.textContent = r.avg; els.finishEff.textContent = r.efficiency;
        $('#next-test').textContent = type === 'stability' ? '查看并生成 →' : '下一项 →';
        els.finish.classList.add('show');
      }

      function stopTest(showIdle = true) {
        cancelAnimationFrame(state.raf); cancelAnimationFrame(state.countdownRaf);
        state.phase = 'idle';
        els.countdown.classList.remove('show'); els.finish.classList.remove('show'); els.target.classList.remove('visible'); els.guide.classList.remove('show');
        if (showIdle) els.idle.classList.remove('hidden');
      }

      function nextIncomplete(afterCurrent = true) {
        const order = testOrder;
        const start = afterCurrent ? order.indexOf(state.activeTest) + 1 : 0;
        for (let i = start; i < order.length; i++) if (!state.results[order[i]]) return order[i];
        return order.find(k => !state.results[k]) || null;
      }

      function recommendDpi(p, r) {
        let fit = ({ arm: -1.4, hybrid: .4, wrist: 1.6 })[p.technique];
        fit += ({ palm: -.9, claw: .35, fingertip: 1 })[p.grip];
        fit += ({ small: .8, medium: 0, large: -.7 })[p.pad];
        fit += r.stability.score >= 82 ? 1 : r.stability.score < 52 ? -1.7 : r.stability.score < 65 ? -.7 : 0;
        fit += r.steering.score >= 82 ? .55 : r.steering.score < 55 ? -.8 : 0;
        fit += r.precision.score >= 82 ? .45 : r.precision.score < 52 ? -.7 : 0;
        fit += r.switching.score >= 82 ? .4 : 0;
        if (p.experience === 'new') fit -= .35;
        if (fit >= 3.4) return 3200;
        if (fit <= -3.8 && p.dpi <= 800) return 400;
        if (fit <= -1.35) return 800;
        return 1600;
      }

      function generateResult() {
        if (!testOrder.every(k => state.results[k])) return toast('请先完成六项测试');
        state.profile = readProfile();
        const p = state.profile, r = state.results;
        let targetEdpi = 270;
        targetEdpi += ({1:-48,2:-24,3:0,4:25,5:50})[p.style];
        targetEdpi += ({arm:-24,hybrid:0,wrist:24})[p.technique];
        targetEdpi += ({palm:-10,claw:4,fingertip:14})[p.grip];
        targetEdpi += ({small:24,medium:0,large:-18})[p.pad];
        targetEdpi += ({duelist:18,initiator:8,controller:-8,sentinel:-14,flex:0})[p.role];
        if (p.experience === 'new') targetEdpi -= 10;

        const slowFlick = clamp((72 - r.flick.score) * .45, -12, 22);
        const controlPenalty = clamp((68 - r.precision.score) * .72, -16, 34);
        const trackPenalty = clamp((65 - r.tracking.score) * .54, -12, 28);
        const switchingNeed = clamp((68 - r.switching.score) * .28, -8, 14);
        const switchingControl = clamp((70 - (r.switching.pathEfficiency || 0)) * .28, -6, 15);
        const steeringPenalty = clamp((68 - r.steering.score) * .46, -10, 24);
        const stabilityPenalty = clamp((70 - r.stability.score) * .58, -10, 30);
        targetEdpi += slowFlick - controlPenalty - trackPenalty + switchingNeed - switchingControl - steeringPenalty - stabilityPenalty;

        if (p.currentSens) {
          const currentEdpi = clamp(p.currentSens * p.dpi, 100, 700);
          targetEdpi = targetEdpi * .84 + currentEdpi * .16;
        }
        targetEdpi = clamp(targetEdpi, 160, 480);
        const recommendedDpi = recommendDpi(p, r);
        let sens = clamp(targetEdpi / recommendedDpi, .01, 10);
        sens = Math.round((sens + Number.EPSILON) * 1000) / 1000;
        const actualEdpi = Math.round(sens * recommendedDpi);
        const cm360 = 13062.86 / (sens * recommendedDpi);
        const low = Math.max(.01, Math.round(sens * .94 * 1000) / 1000);
        const high = Math.min(10, Math.round(sens * 1.06 * 1000) / 1000);

        const dimensions = [['目标获取',r.flick.score],['微调控制',r.precision.score],['连续追踪',r.tracking.score],['反向切换',r.switching.score],['轨迹控制',r.steering.score],['静态稳定',r.stability.score]];
        const ranked = [...dimensions].sort((a,b) => b[1]-a[1]);
        const nearlyEven = ranked[0][1] - ranked[ranked.length - 1][1] < 4;
        const strongest = nearlyEven ? '六项表现' : ranked[0][0];
        const weakest = nearlyEven ? '整体稳定性' : ranked[ranked.length - 1][0];
        const direction = p.style >= 4 || p.technique === 'wrist' ? '偏快速转向' : p.style <= 2 || p.technique === 'arm' ? '偏稳定控制' : '速度与控制均衡';
        const dpiReason = recommendedDpi > p.dpi ? '提高采样分辨率，并用更低的游戏内数值保持相同转身距离' : recommendedDpi < p.dpi ? '降低细微手抖放大感，并用更高的游戏内数值补偿转身距离' : '保留你当前已经适应的硬件档位';
        const analysis = `你的操作档案属于“${direction}”。六项测试中 ${strongest} 最稳定，${weakest} 是当前主要约束。推荐 ${recommendedDpi} DPI，用于${dpiReason}；游戏内灵敏度已经按该 DPI 重新换算。建议固定使用 2–3 天，只有在靶场中连续出现同一种偏差时，才在 ±6% 区间内微调。`;

        state.generated = { sens, actualEdpi, cm360, low, high, analysis, dpi: recommendedDpi, inputDpi: p.dpi, dpiReason };
        save(); renderResult(); showStep(2);
      }

      function renderResult() {
        const g = state.generated; if (!g) return;
        $('#result-sens').textContent = g.sens.toFixed(3);
        $('#input-dpi').textContent = g.inputDpi || state.profile.dpi || g.dpi;
        $('#result-dpi').textContent = g.dpi;
        $('#result-edpi').textContent = g.actualEdpi;
        $('#result-cm').textContent = g.cm360.toFixed(1);
        $('#range-low').textContent = g.low.toFixed(3);
        $('#range-high').textContent = g.high.toFixed(3);
        $('#analysis-copy').textContent = g.analysis;
        $('#apply-dpi').textContent = `${g.dpi} DPI`;
        $('#dpi-callout').innerHTML = `<b>DPI 说明：</b>${g.dpiReason || '推荐 DPI 会改变游戏内灵敏度数字，但不会改变算法给出的实际转身距离。'} 网页无法自动修改鼠标 DPI，请在鼠标驱动中手动设置。`;
        [['flick','目标获取'],['precision','微调控制'],['tracking','连续追踪'],['switching','反向切换'],['steering','轨迹控制'],['stability','静态稳定']].forEach(([key]) => {
          const score = state.results[key]?.score || 0;
          $(`#score-${key}`).textContent = `${score} / 100`;
          requestAnimationFrame(() => $(`#bar-${key}`).style.width = `${score}%`);
        });
      }

      els.dpi.addEventListener('change', () => els.customWrap.hidden = els.dpi.value !== 'custom');
      els.style.addEventListener('input', () => els.styleValue.value = `${els.style.value} / 5`);
      $('#to-tests').addEventListener('click', () => {
        state.profile = readProfile();
        if (!state.profile.dpi || state.profile.dpi < 100) return toast('请填写有效 DPI');
        save(); showStep(1); selectTest(nextIncomplete(false) || 'flick');
      });
      $('#exit-tests').addEventListener('click', () => showStep(0));
      $$('.test-tab').forEach(t => t.addEventListener('click', () => selectTest(t.dataset.test)));
      els.start.addEventListener('click', beginCountdown);
      els.arena.addEventListener('pointermove', pointerMove);
      els.arena.addEventListener('pointerleave', () => { state.pointer.inside = false; state.lastPointer = null; state.lastStabilityPoint = null; els.crosshair.classList.remove('show'); });
      els.arena.addEventListener('pointerenter', () => { state.pointer.inside = true; });
      $('#retry-test').addEventListener('click', () => { stopTest(true); beginCountdown(); });
      $('#next-test').addEventListener('click', () => {
        const next = nextIncomplete(true);
        if (next) selectTest(next); else { els.finish.classList.remove('show'); generateResult(); }
      });
      els.generate.addEventListener('click', generateResult);
      $('#copy-sens').addEventListener('click', async () => {
        const value = state.generated?.sens?.toFixed(3); if (!value) return;
        try { await navigator.clipboard.writeText(value); toast(`已复制 ${value}`); }
        catch (_) {
          const ta = document.createElement('textarea'); ta.value = value; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(`已复制 ${value}`);
        }
      });
      $('#retest').addEventListener('click', () => { state.results = {}; state.generated = null; save(); updateTestChecks(); showStep(1); selectTest('flick'); });
      $('#reset-all').addEventListener('click', () => {
        if (!confirm('确定清空本地档案与全部测试结果？')) return;
        localStorage.removeItem('valsense-v1'); localStorage.removeItem('valsense-v2'); location.reload();
      });
      document.addEventListener('keydown', e => {
        if (e.code === 'Space' && state.step === 1 && state.phase === 'idle') { e.preventDefault(); beginCountdown(); }
        if (e.code === 'Escape' && (state.phase === 'running' || state.phase === 'countdown')) { stopTest(true); toast('测试已暂停'); }
      });
      window.addEventListener('resize', () => {
        if (state.phase === 'running') { stopTest(true); toast('窗口尺寸改变，请重新开始本项'); }
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && state.phase === 'running' && performance.now() >= state.endAt) finishTest();
      });

      load();
      if (state.generated && testOrder.every(k => state.results[k])) renderResult();
      selectTest('flick');
    })();
  </script>
</body>
</html>
